#
# cargo-deny: licenses, security advisories, banned crates and allowed sources.
# Run with `just deny` (part of `just ci`).

[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities and yanked crates. Unmaintained-crate notices only fail for
# crates we depend on directly; deep Linux GUI dependencies of Tauri are outside our control.
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
# An accepted advisory: its id, with a comment saying what it is, why it can't reach the app and
# when to look again (CONTRIBUTING, "When a dependency or size check fails").
ignore = []

[licenses]
# Permissive licenses only. GPL-family licenses are not allowed in the app.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    # Only the desktop app's dependencies, through Tauri: MPL-2.0 (file-level, so our own code's
    # license is unaffected) for its HTML and CSS parsers, and Zlib.
    "MPL-2.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate are reported, not failed: align them when an update allows it.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
