# Invented content that shows the pack format. Not a real aircraft procedure.
id: start-flow
title: Start flow
kind: flow
method: read_and_do
basis: [prior-release]
steps:
  - id: example-trainer.start.walkaround
    text: Nose area
    expect: CLEAR
    role: capt
    walkaround: {x: 160, y: 40}
    look_for: Nothing blocking the intake.
    location: At the nose, left side.

  - id: example-trainer.start.computer
    text: Flight computer
    expect: SET
    role: fo
    opens: example-setup
    hint:
      - {prefix: 'SQUAWK ', field: squawk}
    how: computer
    explain: computer-test

  - id: example-trainer.start.speeds
    text: Takeoff speeds
    expect: V1 ___, VR ___, NOTE ___
    role: pf
    fill: [v1, vr, manual]

  - id: example-trainer.start.warm-up
    text: Engine warm-up
    expect: COMPLETE
    timer:
      seconds: 120
      label: Warm-up
      note: A typical time.
      auto_start:
        from: [example-trainer.start.computer]
        pick: latest

  - id: example-trainer.start.altitude
    text: Altitude knob
    expect: PULL
    role: capt
    controls: [altitude-knob]
    targets:
      - {at: "autoflight/autoflight/#alt", set: PULL}

  - id: example-trainer.start.seat-belts
    text: Seat belts
    expect: "ON"
    role: fo
    controls: [seat-belts]
    targets:
      - {at: "autoflight/cabin/#seat-belts", set: "ON"}

  - id: example-trainer.start.radio
    text: Radio frequency
    expect: ENT
    controls: [radio-keypad]
    targets:
      - {at: "autoflight/cabin/#radio", set: ENT}

  - id: example-trainer.start.radar
    text: Weather radar
    expect: 'OFF'
    not_simulated: true
