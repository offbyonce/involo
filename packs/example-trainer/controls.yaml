# yaml-language-server: $schema=../../schemas/controls.schema.json
# Invented content that shows the pack format. Not a real aircraft procedure.
zones:
  - id: overhead-electrical
    area: Overhead
    title: Electrical panel
    short_title: ELEC
controls:
  - id: battery
    name: Battery switch
    zone: overhead-electrical
    location: Left side of the electrical panel.
    function: Connects the battery.
  - id: speed-knob
    name: Speed knob
    location: Left of the autoflight panel.
    function: Sets the target speed.
  - id: heading-knob
    name: Heading knob
    location: Middle of the autoflight panel.
    function: Sets the target heading.
  - id: altitude-knob
    name: Altitude knob
    location: Right of the heading knob.
    function: Sets the target altitude.
  - id: autopilot
    name: Autopilot pushbutton
    location: Right side of the autoflight panel.
    function: Engages the autopilot.
  - id: autothrust
    name: Autothrust pushbutton
    location: Right of the autopilot pushbutton.
    function: Engages the autothrust.
  - id: seat-belts
    name: Seat belts switch
    location: Cabin panel, left.
    function: Turns the seat belt signs on.
  - id: radio-keypad
    name: Radio keypad
    location: Cabin panel, right.
    function: Enters a frequency.
  - id: briefing
    name: Briefing
    location: Between the crew.
    function: A spoken review of the plan.
overview:
  width: 200
  height: 100
  captions:
    - {text: OVERHEAD, x: 10, y: 10}
  areas:
    - {zone: overhead-electrical, x: 10, y: 20, width: 60, height: 30}
    - {zone: overhead-electrical, x: 80, y: 20, width: 60, height: 30, label: ELEC 2}
  # Invented seat views: one frame per seat the labels list, told apart by their labels.
  views:
    seat:
      left:
        width: 200
        height: 100
        shapes:
          - role: glass
            closed: true
            points: [[20, 20], [96, 18], [96, 56], [24, 58]]
          - role: glass
            closed: true
            points: [[104, 18], [180, 20], [176, 58], [104, 56]]
        labels:
          - {text: FROM THE LEFT SEAT, x: 100, "y": 84}
      right:
        width: 200
        height: 100
        shapes:
          - role: glass
            closed: true
            points: [[20, 20], [96, 18], [96, 56], [24, 58]]
          - role: glass
            closed: true
            points: [[104, 18], [180, 20], [176, 58], [104, 56]]
        labels:
          - {text: FROM THE RIGHT SEAT, x: 100, "y": 84}
