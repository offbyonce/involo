[package]
name = "involo-desktop"
description = "Involo desktop app: the thin Tauri shell around the checklist crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "involo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
involo-app-core.workspace = true
involo-checklist-core.workspace = true
involo-pack.workspace = true
involo-simbrief.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Tauri's mock runtime, for the tests that call each command as the window does.
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
