<!-- An invented panel, saved the way Adobe Illustrator saves a drawing: a DOCTYPE with internal
     entities, names escaped into ids (`_x3A_` for a colon, `_` for a space, `_1_` to keep ids
     apart) or kept in data-name, colors in a style sheet, a matrix transform and a symbol. -->
