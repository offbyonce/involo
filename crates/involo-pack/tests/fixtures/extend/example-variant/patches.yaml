#
# yaml-language-server: $schema=../../../../../../schemas/patches.schema.json
# Invented: a variant of the example trainer whose battery check differs, with no beacon step,
# a cabin sign step after the doors, and its own word for a checklist.
patches:
  - op: set
    step: example-trainer.before-start.battery
    to:
      check: Voltage above 24 on the gauge
  - op: remove
    step: example-trainer.before-start.beacon
  - op: insert_after
    step: example-trainer.before-start.doors
    with:
      id: example-variant.before-start.signs
      number: 4
      section: Cabin
      text: Cabin signs
      expect: 'ON'
  - op: set
    label: list_kinds.checklist
    to: Check
