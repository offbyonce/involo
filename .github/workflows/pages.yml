#
# Publishes the site (apps/web/dist, with the pack catalog in packs/) to GitHub Pages after CI
# passes on the commit it builds (decision 0031). The repository variable SITE_FROM chooses the
# source: "main" until the first release, then "tags", so the site, the catalog and the release
# files always match. A release tag also attaches the pack files and index.json to its release.
# Can also be run by hand.

name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# Least privilege: the build job can only read the repo. Only the deploy job gets the Pages and
# OIDC token permissions that deploy-pages needs, and only the release job may write releases.
permissions:
  contents: read

# One deployment at a time; a newer run waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # After a green CI run on main (until the first release) or on a release tag (from then on),
    # or by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       ((vars.SITE_FROM != 'tags' && github.event.workflow_run.head_branch == 'main') ||
        (vars.SITE_FROM == 'tags' && startsWith(github.event.workflow_run.head_branch, 'v'))))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # `just site` builds the WebAssembly module, the app and the pack catalog with Rust.
      - name: Rust (version and targets from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown

      # wasm-bindgen must be the same version as the crate pinned in Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-bindgen@0.2.130

      # pnpm first (version from package.json "packageManager"), so setup-node can find it.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: just site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

      # The catalog alone, for the release job.
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: apps/web/dist/packs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    # A release tag: attach the pack files and index.json to its GitHub release.
    needs: deploy
    if: github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: catalog
          path: catalog
      - name: Attach the catalog to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" catalog/* --repo "$GITHUB_REPOSITORY" --clobber
