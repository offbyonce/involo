#
# Publishes the site to GitHub Pages after CI passes on a commit: exactly the site CI built and
# tested (the e2e job's `site` artifact: apps/web/dist, with the pack catalog in packs/). Nothing
# is checked out, installed or built here. The repository variable SITE_FROM chooses the source:
# "main" until the first release, then "tags", so the site, the catalog and the release files
# always match. A release tag also attaches the pack files, index.json and the `involo-pack`
# command for each platform (CI's `cli` job) to its release.
# Can also be run by hand, to publish a given CI run's site or the newest one SITE_FROM chooses.

name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: >-
          The CI run whose site to publish (the number in the run's address). Leave it empty for
          the newest green CI run on main, or on a release tag once SITE_FROM is "tags".
        required: false
        default: ""

# Least privilege: the site job can only read the repo and its workflow runs. Only the deploy job
# gets the Pages and OIDC token permissions that deploy-pages needs, and only the release job may
# write releases.
permissions:
  contents: read

# One deployment at a time; a newer run waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    # After a green CI run on main (until the first release) or on a release tag (from then on),
    # or by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       ((vars.SITE_FROM != 'tags' && github.event.workflow_run.head_branch == 'main') ||
        (vars.SITE_FROM == 'tags' && startsWith(github.event.workflow_run.head_branch, 'v'))))
    runs-on: ubuntu-latest
    permissions:
      # To find the CI run and download its artifact.
      actions: read
    outputs:
      run_id: ${{ steps.pick.outputs.run_id }}
    steps:
      # The CI run to publish: the one that triggered this run, the one asked for, or the newest
      # green one. Whichever it is, it must be a green CI run for a push to this repository, on
      # the branch or tag SITE_FROM chooses.
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
          ASKED_RUN: ${{ inputs.run_id }}
          SITE_FROM: ${{ vars.SITE_FROM }}
        run: |
          set -euo pipefail
          from=main
          if [ "$SITE_FROM" = tags ]; then from=tags; fi
          if [ "$EVENT" = workflow_run ]; then
            run="$TRIGGER_RUN"
          elif [ -n "$ASKED_RUN" ]; then
            run="$ASKED_RUN"
          else
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&status=success&per_page=100" \
              | jq -r --arg from "$from" '[.workflow_runs[]
                  | select(if $from == "tags" then (.head_branch | startswith("v")) else .head_branch == "main" end)
                ][0].id // empty')
          fi
          case "$run" in
            "" | *[!0-9]*) echo "::error::Not a CI run number: '$run'"; exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
            | jq -e --arg repo "$GITHUB_REPOSITORY" --arg from "$from" '
                .path == ".github/workflows/ci.yml" and .event == "push" and .conclusion == "success"
                and .head_repository.full_name == $repo
                and (if $from == "tags" then (.head_branch | startswith("v")) else .head_branch == "main" end)' >/dev/null \
            || { echo "::error::Run $run is not a green CI run for a push to $from"; exit 1; }
          echo "run_id=$run" >> "$GITHUB_OUTPUT"

      # Outside the workspace: the files are only published, never run.
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ runner.temp }}/site
          run-id: ${{ steps.pick.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    # A release tag: attach the pack files and index.json, from the same site, and the
    # `involo-pack` binaries and the desktop app's installers CI built for the tag, to its GitHub
    # release, with their SHA-256 sums.
    needs: [site, deploy]
    if: github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ runner.temp }}/site
          run-id: ${{ needs.site.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: involo-pack-*
          merge-multiple: true
          path: ${{ runner.temp }}/cli
          run-id: ${{ needs.site.outputs.run_id }}
          github-token: ${{ github.token }}
      # The desktop app's installers (decision 0031), unsigned: Involo_<version>_x64-setup.exe for
      # Windows, and Involo_<version>_aarch64.dmg and Involo_<version>_x64.dmg for macOS.
      - uses: actions/download-artifact@v8
        with:
          pattern: involo-desktop-*
          merge-multiple: true
          path: ${{ runner.temp }}/desktop
          run-id: ${{ needs.site.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Attach the catalog, the command and the desktop app to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          CATALOG: ${{ runner.temp }}/site/packs
          CLI: ${{ runner.temp }}/cli
          DESKTOP: ${{ runner.temp }}/desktop
        run: |
          (cd "$CLI" && sha256sum involo-pack-* > involo-pack-SHA256SUMS.txt)
          # All three installers, or no release: a missing one fails the job.
          (cd "$DESKTOP" && ls Involo_*_x64-setup.exe Involo_*_aarch64.dmg Involo_*_x64.dmg >/dev/null \
            && sha256sum Involo_* > involo-desktop-SHA256SUMS.txt)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" "$CATALOG"/* "$CLI"/* "$DESKTOP"/* --repo "$GITHUB_REPOSITORY" --clobber
