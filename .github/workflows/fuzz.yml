#
# Fuzzes everything that reads pack data, once a week and on demand: each target in
# fuzz/fuzz_targets runs for five minutes from the seed corpus of the packs and fixtures, plus what
# earlier runs found (kept in the cache). An input that crashes, hangs or runs out of memory fails
# the job and is uploaded as an artifact; add it as a regression test with its fix.
# No secrets are available to this workflow.
name: Fuzz

on:
  schedule:
    # Mondays at 04:17 UTC.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: How long each target runs, in seconds
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [pack_file, pack_edits, data_file, pack_folder]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The pinned toolchain builds the test packs the seeds come from; cargo-fuzz needs nightly.
      - name: Rust (pinned, and nightly for cargo-fuzz)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup toolchain install nightly --profile minimal

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-fuzz

      # pnpm is not needed: the seed script uses Node alone. setup-node v5 caches for the
      # packageManager named in package.json by default, which looks for pnpm, so that is off.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # What earlier runs found, per target, so each run starts where the last one stopped.
      - uses: actions/cache@v6
        with:
          path: target/fuzz-corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # The run length arrives as an input, so it goes through the environment and must be a number.
      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '300' }}
        run: |
          case "$FUZZ_SECONDS" in ''|*[!0-9]*) echo "seconds must be a whole number" >&2; exit 1;; esac
          just fuzz ${{ matrix.target }} "$FUZZ_SECONDS"

      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-failures
          path: |
            target/fuzz-artifacts/${{ matrix.target }}
            fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
