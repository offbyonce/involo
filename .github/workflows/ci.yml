#
# Runs the same `just ci` as a developer machine, on Windows, macOS and Linux.
# No secrets are available to this workflow.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The toolchain file names the wasm target too; the explicit add makes sure it is there.
      - name: Rust (version and targets from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown

      # The compiled dependencies from main's last run (Cargo.lock and the toolchain in the key); the
      # workspace's own crates always build fresh. Only main saves, so pull requests don't fill the
      # cache with their own copies.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # wasm-bindgen must be the same version as the crate pinned in Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,wasm-bindgen@0.2.130

      # pnpm first (version from package.json "packageManager"), so setup-node can find it.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: just ci

  # A release tag: the `involo-pack` command for Windows, macOS and Linux, for the Pages
  # workflow's release job to attach to the release (#109). Built from the tag CI tests.
  cli:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The version from rust-toolchain.toml, with the platform's target (Intel macOS builds on
      # an Apple silicon runner).
      - name: Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
        shell: bash

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p involo-pack-cli --target "$TARGET"
        shell: bash

      - name: Name the binary after its platform
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/involo-pack$EXE" "dist/involo-pack-$TARGET$EXE"
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: involo-pack-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # The desktop app (decision 0031): its Rust crate's lints and tests, then its installer, on the
  # systems it ships on (Intel macOS builds on an Apple silicon runner). Not a required check. On a
  # pull request or a push to main it builds only when the change touches something the app is
  # built from (main's builds also save the Rust cache); on a release tag, always. The installers
  # are kept as artifacts, unsigned.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            check: true
          - os: macos-latest
            target: aarch64-apple-darwin
            check: true
          - os: macos-latest
            target: x86_64-apple-darwin
            check: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Does this change touch the desktop app?
        id: changed
        if: github.ref_type != 'tag'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^(apps/desktop/|apps/web/src/|packages/ui/|packages/bindings/|crates/|Cargo\.toml$|Cargo\.lock$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|justfile$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the desktop app is built from changed."
          fi
        shell: bash

      - name: Rust
        if: steps.changed.outputs.build != 'false'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
        shell: bash

      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.build != 'false'
        with:
          key: desktop-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        if: steps.changed.outputs.build != 'false'
        with:
          tool: just,cargo-nextest

      - uses: pnpm/action-setup@v6
        if: steps.changed.outputs.build != 'false'

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.build != 'false'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.changed.outputs.build != 'false'

      - run: just desktop-check
        if: steps.changed.outputs.build != 'false' && matrix.check

      - name: Installer
        if: steps.changed.outputs.build != 'false'
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm --filter @involo/desktop tauri build --target "$TARGET"
        shell: bash

      # The installer on its own in one folder, so it sits at the artifact's root. With two
      # paths, upload-artifact roots the artifact at their common folder, which would put it under
      # nsis/ or dmg/. The release (pages.yml) attaches it from there.
      - name: Collect the installer
        if: steps.changed.outputs.build != 'false'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p target/desktop-installer
          find "target/$TARGET/release/bundle" -type f \( -path '*/nsis/*.exe' -o -path '*/dmg/*.dmg' \) \
            -exec cp {} target/desktop-installer/ \;
        shell: bash

      - uses: actions/upload-artifact@v7
        if: steps.changed.outputs.build != 'false'
        with:
          name: involo-desktop-${{ matrix.target }}
          path: target/desktop-installer/
          if-no-files-found: error

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@v5

  # The site the end-to-end flows test, built once (`just site test-packs`): the WebAssembly, the
  # app, the pack catalog, and the example packs' catalog the flows add packs from. On a push it is
  # also the site the Pages workflow publishes, with nothing rebuilt (#201): Pages runs only when
  # the whole CI run passed, the flows on this same site included. The release attaches its
  # packs/ files.
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Rust (version and targets from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-bindgen@0.2.130

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: just site test-packs

      - uses: actions/upload-artifact@v7
        with:
          name: e2e-site
          path: |
            apps/web/dist
            target/test-packs
          if-no-files-found: error
          retention-days: 1

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/web/dist
          if-no-files-found: error

  # The end-to-end flows with their layout and accessibility checks (#163) on that site, Chromium
  # and WebKit side by side, served locally with the catalog, the network blocked. The token rules
  # run in `just ci` above (Vitest). The Playwright image has the browsers and their system
  # libraries, so nothing comes from the Ubuntu mirrors; its tag follows @playwright/test in
  # pnpm-workspace.yaml. A pull request checks the main screens with two packs, the iFly pack and
  # the example furthest from it; main checks every pack.
  e2e-browser:
    name: e2e (${{ matrix.browser }})
    needs: site
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: e2e-site

      # Already in the image at its version; this fetches the browser only if @playwright/test has
      # moved past the image's tag.
      - env:
          BROWSER: ${{ matrix.browser }}
        run: pnpm --filter @involo/web exec playwright install "$BROWSER"

      - env:
          CI: "1"
          BROWSER: ${{ matrix.browser }}
          E2E_SCREENS_PACKS: ${{ github.event_name == 'pull_request' && 'ifly-737-max8,example-sidestick' || '' }}
        run: pnpm --filter @involo/web e2e --project="$BROWSER"

      # On a failure: the HTML report, with each failed test's trace and the page as it was.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.browser }}
          path: target/e2e
          retention-days: 14

  # The service worker's version-to-version update test (`just update-test`, #41) on that site, in
  # headless Firefox: the first visit installs it, it loads offline, a new version waits with the
  # reload offer, Reload brings it in, and a copy installed from the old app/ address moves to the
  # front page. The Playwright image has Firefox; apps/web/build/browser.mjs finds it through
  # PLAYWRIGHT_BROWSERS_PATH. It needs only Node, no packages. HOME is root's own, since Firefox
  # refuses to run as root with a HOME owned by another user (the runner's, mounted at
  # /github/home).
  update-test:
    needs: site
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: e2e-site

      - env:
          HOME: /root
        run: node apps/web/build/update-test.mjs

  # The check the ruleset requires, by its old name: passes only when both browsers and the update
  # test passed.
  e2e:
    if: always()
    needs: [e2e-browser, update-test]
    runs-on: ubuntu-latest
    steps:
      - env:
          BROWSERS: ${{ needs.e2e-browser.result }}
          UPDATE: ${{ needs.update-test.result }}
        run: test "$BROWSERS" = success && test "$UPDATE" = success
