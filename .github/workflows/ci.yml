#
# Runs the same `just ci` as a developer machine, on Windows, macOS and Linux.
# No secrets are available to this workflow.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The toolchain file names the wasm target too; the explicit add makes sure it is there.
      - name: Rust (version and targets from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown

      # wasm-bindgen must be the same version as the crate pinned in Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,wasm-bindgen@0.2.130

      # pnpm first (version from package.json "packageManager"), so setup-node can find it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: just ci

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@v5

  # The end-to-end flows with their layout and accessibility checks (#163): the built site in
  # Chromium and WebKit, served locally with the catalog, the network blocked. The token rules
  # run in `just ci` above (Vitest). About five minutes, most of it building the site.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Rust (version and targets from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-bindgen@0.2.130

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browsers at the version @playwright/test pins, with their system libraries.
      - run: pnpm --filter @involo/web exec playwright install --with-deps chromium webkit

      - run: just e2e
        env:
          CI: "1"

      # On a failure: the HTML report, with each failed test's trace and the page as it was.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: target/e2e
          retention-days: 14
