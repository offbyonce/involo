name: Problem with a step
description: Opened from a step's menu in Involo, with the step filled in.
labels: ["content", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for checking this step against the aircraft.

        **Please describe what you see in the simulator in your own words. Don't paste, quote or
        link manuals or other documentation**: Involo's procedures are written independently, and
        we can't take text from them.

        The first four fields came from Involo. Leave them as they are.
  - type: input
    id: pack
    attributes:
      label: Pack
      description: The pack's id and version.
    validations:
      required: true
  - type: input
    id: list
    attributes:
      label: List
      description: The checklist or flow the step is in.
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Step
      description: The step's id.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Involo version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong
      description: The value, wording, location or order as Involo shows it, and what it should be.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How you know
      description: What you saw in the simulator, and where (panel, page or display). No manual quotes or links, please.
    validations:
      required: true
  - type: input
    id: simulator
    attributes:
      label: Simulator and aircraft version
    validations:
      required: false
