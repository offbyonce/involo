[workspace]
resolver = "3"
members = [
    "crates/involo-app-core",
    "crates/involo-checklist-core",
    "crates/involo-pack",
    "crates/involo-pack-cli",
    "crates/involo-pack-overlap",
    "crates/involo-simbrief",
    "crates/involo-web-host",
]
# Parked for Phase 2 (decision 0010): kept in the repo, not built. See PARKED.md in each.
exclude = ["apps/desktop/src-tauri", "crates/store", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["offbyonce"]
repository = "https://github.com/offbyonce/involo"
publish = false

# Every dependency version lives here, once. Member crates write `name.workspace = true`.
[workspace.dependencies]
# Our own crates
involo-app-core = { path = "crates/involo-app-core" }
involo-checklist-core = { path = "crates/involo-checklist-core" }
involo-pack = { path = "crates/involo-pack" }
involo-pack-overlap = { path = "crates/involo-pack-overlap" }
involo-simbrief = { path = "crates/involo-simbrief" }
store = { path = "crates/store" }

# Data and schema
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.1.1"
# Saved SimBrief plans are XML; small, read-only and with no dependencies of its own.
roxmltree = "0.21.2"
schemars = "1.2"
semver = { version = "1.0.28", features = ["serde"] }
# The content hash a built pack records (decision 0029): SHA-256 from RustCrypto, rather than our
# own hashing code.
sha2 = "0.10"
ts-rs = { version = "12.0", features = ["no-serde-warnings"] }
# WebAssembly glue. Exact pin: the wasm-bindgen CLI must be the same version (decision 0010).
wasm-bindgen = "=0.2.130"

# Errors and logging
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Storage
rusqlite = { version = "0.41", features = ["bundled"] }

# App shell (pinned together, upgraded together)
tauri = { version = "=2.12.5", features = [] }
tauri-build = { version = "=2.7.4", features = [] }

# Testing
insta = { version = "1.49", features = ["json"] }
proptest = "1.12"
rstest = "0.28"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Product names like SimBrief and SimConnect are not code; backticking them adds noise.
doc_markdown = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

# The WebAssembly build (`just wasm`). Not stripped, so wasm-bindgen can read which WebAssembly
# features the module uses; wasm-bindgen removes the name and producers sections instead.
[profile.wasm]
inherits = "release"
strip = false
