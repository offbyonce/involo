# SPDX-FileCopyrightText: 2026 offbyonce
# SPDX-License-Identifier: MIT
#
# Licenses for files that cannot carry a comment header. Code is MIT; checklist
# content in packs/, the pack snapshots in crates/involo-pack-cli/tests/snapshots/ and the step id
# list in crates/involo-pack-cli/tests/fixtures/ is
# CC BY-NC-SA 4.0. Check with `reuse lint` (https://reuse.software).
version = 1

[[annotations]]
path = [
    "**/*.json",
    "**/*.webmanifest",
    "**/*.lock",
    "pnpm-lock.yaml",
    "**/*.snap",
    "**/*.png",
    "**/*.ico",
    "**/*.icns",
    "packages/bindings/src/generated/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 offbyonce"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["packs/**", "crates/involo-pack-cli/tests/snapshots/**", "crates/involo-pack-cli/tests/fixtures/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 offbyonce and Involo contributors"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

[[annotations]]
path = ["apps/web/src/fonts/*.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2023 Vercel, in collaboration with basement.studio"
SPDX-License-Identifier = "OFL-1.1"

# Tabler icons, copied unmodified (only the ones the interface uses). MIT requires keeping the
# upstream copyright notice, which names its author; AGENTS.md allows such required notices.
[[annotations]]
path = ["packages/ui/src/icons/tabler/*.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2020-2026 Paweł Kuna"
SPDX-License-Identifier = "MIT"

# Real public weather reports used as test fixtures.
[[annotations]]
path = ["crates/involo-app-core/tests/fixtures/weather/*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 offbyonce"
SPDX-License-Identifier = "MIT"

# Icons drawn on the approved boards (docs/design), copied as drawn.
[[annotations]]
path = ["packages/ui/src/icons/board/*.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 offbyonce"
SPDX-License-Identifier = "MIT"

# The interface design (docs/design): its files carry no comment headers, so they are licensed here.
[[annotations]]
path = [
    "docs/design/README.md",
    "docs/design/rules.md",
    "docs/design/screens.md",
    "docs/design/coverage.md",
    "docs/design/content-to-validate.md",
    "docs/design/boards/**",
    "docs/design/review/**",
    "docs/design/round6/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 offbyonce"
SPDX-License-Identifier = "MIT"

# The Involo brand (decision 0025): the logo masters, every platform icon made from them and the
# header mark. All rights reserved, with permission to use them unmodified to refer to Involo
# (LICENSES/LicenseRef-Involo-Brand.txt), a deliberate exception to decision 0003's open licenses.
[[annotations]]
path = [
    "assets/brand/*.svg",
    "assets/brand/icons/**",
    "apps/web/public/icons/**",
    "apps/web/public/og-image-1200x630.png",
    "apps/desktop/src-tauri/icons/**",
    "packages/ui/src/icons/brand/*.svg",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 offbyonce"
SPDX-License-Identifier = "LicenseRef-Involo-Brand"

# The license of the font the outlined wordmark comes from, kept beside the artwork.
[[annotations]]
path = ["assets/brand/GEIST-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2023 Vercel, in collaboration with basement.studio"
SPDX-License-Identifier = "OFL-1.1"

# The brand guide and design system (docs/brand): their files carry no comment headers, so they are
# licensed here.
[[annotations]]
path = ["docs/brand/BRAND.md", "docs/brand/DESIGN-SYSTEM.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 offbyonce"
SPDX-License-Identifier = "MIT"
