packages:
  - apps/web
  - packages/*

# Every JS dependency version lives here, once. Packages write "catalog:".
catalog:
  "@axe-core/playwright": 4.14.0
  "@biomejs/biome": 2.6.8
  "@playwright/test": 1.65.1
  "@sveltejs/vite-plugin-svelte": 7.3.1
  "@testing-library/svelte": 5.4.2
  jsdom: 31.0.1
  lefthook: 2.2.2
  svelte: 5.58.0
  svelte-check: 4.7.8
  typescript: 7.0.2
  vite: 8.3.8
  vitest: 5.1.1

# Supply-chain guard: never install a version published less than a day ago.
minimumReleaseAge: 1440

# Packages allowed to run install scripts (lefthook installs its git hooks).
allowBuilds:
  lefthook: true

# `pnpm audit` (`just deny`): high and critical advisories fail. An accepted advisory goes in
# `ignore` with a comment saying what it is, why it can't reach the app and when to look again,
# and comes out once a fixed version is in:
#   - GHSA-xxxx-xxxx-xxxx  # what, why it can't reach the app, when to look again
audit:
  level: high
  ignore: []
